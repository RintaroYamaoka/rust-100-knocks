[package]
name = "rust-100-knocks-api"
version = "0.1.0"
edition = "2021"
publish = false

# Vercel 公式 Rust ランタイム: api/*.rs を個別バイナリとしてビルドする
[[bin]]
name = "execute"
path = "api/execute.rs"

[dependencies]
shared = { path = "crates/shared" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
vercel_runtime = "2"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace]
resolver = "2"
members = [".", "crates/shared", "crates/app", "crates/verifier"]

[profile.release]
opt-level = "s"
lto = true
